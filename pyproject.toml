[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fonemago"
version = "0.1.0"
description = "Telegram pronunciation practice with reviewed Wikimedia examples"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiogram>=3.20,<4",
  "aiosqlite>=0.21,<1",
  "beautifulsoup4>=4.13,<5",
  "pydantic-settings>=2.9,<3",
]

[project.scripts]
fonemago = "fonemago.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
